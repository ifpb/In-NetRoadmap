services:
  # Environment images
  server:
    build: ./images/server
    container_name: srv
    cpus: '0.8'

  bmv2:
    build: ./images/bmv2
    container_name: bmv2
    command: /bin/bash

  client:
    build: ./images/node
    container_name: cli

    command: /bin/bash
    tty: true
    stdin_open: true

  # Containernet privileged image
  containernet-lab:
    image: containernet/containernet:latest
    container_name: containernet-lab
    privileged: true
    pid: host
    tty: true
    stdin_open: true

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}/containernet:/containernet

    environment:
      - PYTHONUNBUFFERED=1

    working_dir: /containernet

    entrypoint: /bin/bash

    networks:
      - lab-network

    healthcheck:
      test: ["CMD", "docker", "ps"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  lab-network:
    driver: bridge
